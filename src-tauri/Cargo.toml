[package]
name = "ytdlp-gui"
version = "0.1.0"
description = "A modern, cross-platform GUI for yt-dlp"
authors = ["yt-dlp GUI contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "ytdlp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
thiserror = "2"
dirs = "6"
ts-rs = "11"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
